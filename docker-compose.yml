services:

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    volumes:
      - ./db/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Faculty list (data/faculty-emails.txt), read-only.
    volumes:
      - ./data:/bot/data:ro
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      GUILD_ID: ${GUILD_ID}
      ADMIN_ROLE_ID: ${ADMIN_ROLE_ID}
      MODERATOR_ROLE_ID: ${MODERATOR_ROLE_ID}
      STUDENT_ROLE_ID: ${STUDENT_ROLE_ID}
      PROFESSOR_ROLE_ID: ${PROFESSOR_ROLE_ID}
      GUEST_ROLE_ID: ${GUEST_ROLE_ID}
      ADMIN_CHANNEL_ID: ${ADMIN_CHANNEL_ID}
      GUEST_CHANNEL_ID: ${GUEST_CHANNEL_ID}
      SEMESTER_ROLE_IDS: ${SEMESTER_ROLE_IDS:-}
      SEMESTER_ALLOWED_ROLE_IDS: ${SEMESTER_ALLOWED_ROLE_IDS:-}
      BOT_STATUS: ${BOT_STATUS:-}
      UNI_ID_HASH_SECRET: ${UNI_ID_HASH_SECRET}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_DOMAIN: ${EMAIL_DOMAIN:-}
      EMAIL_STUDENT_PATTERN: ${EMAIL_STUDENT_PATTERN:-}
      FACULTY_EMAILS_FILE: /bot/data/faculty-emails.txt
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

volumes:
  mariadb-data:
